overview:
  name: macOS File AI Agent Authentication
  description: 'This event is generated when an AI coding agent writes one of its credential
    files and Elastic Endpoint resolves the account the agent is authenticated with. It is
    emitted in addition to the file event for the write itself.

    '
identification:
  filter:
    event.action: ai_agent_auth
    event.dataset: endpoint.events.file
    event.module: endpoint
    host.os.type: macos
  os:
  - macos
  data_stream: logs-endpoint.events.file-*
fields:
  endpoint:
  - '@timestamp'
  - Effective_process.entity_id
  - Effective_process.executable
  - Effective_process.name
  - Effective_process.pid
  - agent.id
  - agent.type
  - agent.version
  - data_stream.dataset
  - data_stream.namespace
  - data_stream.type
  - ecs.version
  - elastic.agent.id
  - event.action
  - event.category
  - event.created
  - event.dataset
  - event.id
  - event.kind
  - event.module
  - event.outcome
  - event.sequence
  - event.type
  - file.Ext.entropy
  - file.Ext.header_bytes
  - file.Ext.original.extension
  - file.Ext.original.path
  - file.ai_agent.api_key_auth
  - file.ai_agent.email
  - file.ai_agent.name
  - file.extension
  - file.hash.sha256
  - file.inode
  - file.name
  - file.origin_referrer_url
  - file.origin_url
  - file.path
  - file.size
  - group.Ext.real.id
  - group.Ext.real.name
  - group.id
  - group.name
  - host.architecture
  - host.domain
  - host.hostname
  - host.id
  - host.ip
  - host.mac
  - host.name
  - host.os.Ext.variant
  - host.os.family
  - host.os.full
  - host.os.kernel
  - host.os.name
  - host.os.platform
  - host.os.type
  - host.os.version
  - message
  - process.Ext.ancestry
  - process.code_signature.exists
  - process.code_signature.signing_id
  - process.code_signature.status
  - process.code_signature.subject_name
  - process.code_signature.team_id
  - process.code_signature.trusted
  - process.command_line
  - process.entity_id
  - process.executable
  - process.name
  - process.parent.pid
  - process.pid
  - user.Ext.real.id
  - user.Ext.real.name
  - user.id
  - user.name
