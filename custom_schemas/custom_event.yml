---
- name: event
  title: Event
  group: 2
  short: Fields breaking down the event details.
  description: >
    The event fields are used for context information about the log or metric event itself.

    A log is defined as an event containing details of something that happened.
    Log events must include the time at which the thing happened.
    Examples of log events include a process starting on a host,
    a network packet being sent from a source to a destination,
    or a network connection between a client and a server being initiated or closed.
    A metric is defined as an event containing one or more numerical measurements
    and the time at which the measurement was taken. Examples of metric events include
    memory pressure measured on a host and device temperature.
    See the `event.kind` definition in this section for additional details about
    metric and state events.
  type: group
  fields:
    - name: Ext
      level: custom
      type: object
      description: Object for all custom defined fields to live in.

    - name: Ext.correlation
      level: custom
      type: object
      description: Information about event this should be correlated with.
    
    - name: Ext.correlation.id
      level: custom
      type: keyword
      description: ID of event that this event is correlated to, e.g. quarantine event associated with an unquarantine event

    - name: Ext.agent_exposure
      level: custom
      type: object
      description: "Content-free findings about candidate credentials or sensitivity labels observed in AI tools."

    - name: Ext.agent_exposure.contract_version
      level: custom
      type: long
      description: "Version of the content exposure finding contract."

    - name: Ext.agent_exposure.stage
      level: custom
      type: keyword
      ignore_above: 256
      description: "Observation stage: input, submission or persistence. A stage does not establish successful upload."

    - name: Ext.agent_exposure.harness
      level: custom
      type: keyword
      ignore_above: 256
      description: "AI tool family identified by the adapter or inferred from an eligible session artifact."

    - name: Ext.agent_exposure.evidence
      level: custom
      type: keyword
      ignore_above: 256
      description: "Observation evidence, such as reported paste, reported submission, a local store write or bounded default-store discovery. Discovery does not identify a writer or prior gesture."

    - name: Ext.agent_exposure.evidence_trust
      level: custom
      type: keyword
      ignore_above: 256
      description: "Trust assigned to the evidence. User-session reports are not authenticated vendor observations."

    - name: Ext.agent_exposure.harness_source
      level: custom
      type: keyword
      ignore_above: 256
      description: "Source of the AI tool attribution, such as an adapter report."

    - name: Ext.agent_exposure.observation_outcome
      level: custom
      type: keyword
      ignore_above: 256
      description: "Observed outcome. An attempted action does not establish application acceptance or upload."

    - name: Ext.agent_exposure.observation_scope
      level: custom
      type: keyword
      ignore_above: 256
      description: "Content scope reported by the collector, such as text only, extracted attachment text or bounded default-store discovery."

    - name: Ext.agent_exposure.process_role
      level: custom
      type: keyword
      ignore_above: 256
      description: "Role of the associated process, such as reporter or scan trigger; not necessarily the credential author. Discovery reports none and omits process identity."

    - name: Ext.agent_exposure.credential_writer
      level: custom
      type: keyword
      ignore_above: 256
      description: "Whether the credential author is established. Later persistence snapshots report unknown."

    - name: Ext.agent_exposure.content_omitted
      level: custom
      type: boolean
      description: "True when matched values, prompt contents and document text are excluded from the finding."

    - name: Ext.agent_exposure.detector_ids
      level: custom
      type: keyword
      ignore_above: 256
      description: "Static identifiers of matching credential or sensitivity-label patterns. Contains no matched values."

    - name: Ext.agent_exposure.ruleset_version
      level: custom
      type: keyword
      ignore_above: 256
      description: "Version identifying the immutable classifier catalog used for this observation."

    - name: Ext.agent_exposure.ruleset_source
      level: custom
      type: keyword
      ignore_above: 256
      description: "Source of the classifier catalog, such as the authenticated global configuration artifact."

    - name: Ext.agent_exposure.classifier
      level: custom
      type: keyword
      ignore_above: 256
      description: "Classifier used to identify syntax candidates, such as content_patterns."

    - name: Ext.agent_exposure.qualification
      level: custom
      type: keyword
      ignore_above: 256
      description: "Qualification of a match. A syntax candidate is not proof that a credential is valid."

    - name: Ext.agent_exposure.scan_complete
      level: custom
      type: boolean
      description: "Whether all admitted content was examined within the supported format and scan bounds."

    - name: Ext.agent_exposure.history_omitted
      level: custom
      type: boolean
      description: "Whether the bounded persistence snapshot omitted earlier session history."

    - name: Ext.agent_exposure.artifact_class
      level: custom
      type: keyword
      ignore_above: 256
      description: "Class of the eligible local session artifact. Contains no file path."

    - name: Ext.agent_exposure.application_attribution
      level: custom
      type: keyword
      ignore_above: 256
      description: "Basis for associating the artifact with an AI tool; a path match does not prove vendor origin."

    - name: Ext.agent_exposure.file_identity
      level: custom
      type: keyword
      ignore_above: 256
      description: "Whether identity was checked against both event and snapshot, or against the scan-time snapshot only."
