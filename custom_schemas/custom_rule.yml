---
- name: rule
  title: Rule
  group: 2
  short: Fields to capture details about rules used to generate alerts or other notable events.
  description: >
    Rule fields are used to capture the specifics of any observer or agent rules that generate alerts or other notable events.

    Examples of data sources that would populate the rule fields include: network admission control platforms, network or
    host IDS/IPS, network firewalls, web application firewalls, url filters, endpoint detection and response (EDR) systems, etc.

  type: group
  fields:
    - name: custom_yara_signature
      level: custom
      type: object
      description: Details of the user-defined YARA signature that generated the alert.

    - name: custom_yara_signature.entry_id
      level: custom
      type: keyword
      description: Identifier of the user YARA entry that defined the matched rule.

    - name: custom_yara_signature.entry_name
      level: custom
      type: keyword
      description: Name of the user YARA entry that defined the matched rule.

    - name: custom_yara_signature.rule_identifier
      level: custom
      type: keyword
      description: Identifier of the matched user-defined YARA rule.
